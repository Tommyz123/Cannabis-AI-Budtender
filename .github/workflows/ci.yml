name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (pytest)
        # Unit + integration tests mock the OpenAI client (see tests/conftest.py),
        # so no API key is needed. Real LLM eval (eval/run_eval.py) is intentionally
        # excluded here — it hits the OpenAI API and costs money; run it manually.
        run: pytest -q

      - name: Security scan (bandit)
        # Fail only on medium/high severity findings. Low-severity noise
        # (e.g. defensive try/except/pass) is reported but non-blocking.
        run: bandit -r backend -q --severity-level medium
